name: PR comment

on:
  issue_comment:
    types: [created]

jobs:
  show-comment:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Show the comment
        env:
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "Comment by $AUTHOR"
          echo "Body: $BODY"
