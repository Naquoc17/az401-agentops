name: ci-$(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

pool:
  vmImage: "ubuntu-latest"

jobs:
  - job: first
    steps:
      - script: |
          echo "written by first" > /tmp/marker.txt
          hostname
        displayName: "Write marker"
  - job: second
    dependsOn: first
    steps:
      - script: |
          hostname
          cat /tmp/marker.txt
        displayName: "Read marker"
